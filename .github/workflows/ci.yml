name: MiniStaff dashboard CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Summarize dependency advisories without masking build failures
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/ministaff-audit.json" || true
          node - "$RUNNER_TEMP/ministaff-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("npm audit totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? []).filter((x) => typeof x === "object").map((x) => `${x.name}: ${x.title} [${x.range}]`).join("; ");
            console.log(`${item.severity.toUpperCase()} ${name}: direct=${item.isDirect}, range=${item.range}, fix=${JSON.stringify(item.fixAvailable)}${advisories ? `; ${advisories}` : ""}`);
          }
          NODE
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
