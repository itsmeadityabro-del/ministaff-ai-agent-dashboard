name: MiniStaff dashboard CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/ministaff-sales-desk
      - build/ministaff-from-scratch
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Security regression tests
        run: npm run test:security
      - name: Production build
        run: npm run build
