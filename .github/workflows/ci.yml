name: MiniStaff dashboard CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply available semver-compatible npm security fixes to the lockfile
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit security-updated lockfile on the development branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'package-lock.json';
            const local = fs.readFileSync(path, 'utf8');
            const branch = context.ref.replace('refs/heads/', '');
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch,
            });
            const remote = Buffer.from(current.data.content, 'base64').toString('utf8');
            if (remote === local) {
              core.info('No package-lock changes from npm audit fix.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'security: apply compatible npm audit fixes',
              branch,
              sha: current.data.sha,
              content: Buffer.from(local, 'utf8').toString('base64'),
            });
            core.info('Committed npm audit lockfile fixes to the development branch.');
      - run: npm ci
      - name: Summarize dependency advisories without masking build failures
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/ministaff-audit.json" || true
          node - "$RUNNER_TEMP/ministaff-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("npm audit totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? []).filter((x) => typeof x === "object").map((x) => `${x.name}: ${x.title} [${x.range}]`).join("; ");
            console.log(`${item.severity.toUpperCase()} ${name}: direct=${item.isDirect}, range=${item.range}, fix=${JSON.stringify(item.fixAvailable)}${advisories ? `; ${advisories}` : ""}`);
          }
          NODE
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
