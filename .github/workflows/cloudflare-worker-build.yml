name: MiniStaff Cloudflare Worker build

on:
  workflow_dispatch:
  push:
    branches:
      - build/ministaff-from-scratch
    paths:
      - ".github/workflows/cloudflare-worker-build.yml"
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "cloudflare.config.ts"
      - "vite.config.ts"

permissions:
  contents: write

concurrency:
  group: ministaff-cloudflare-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-build:
    name: Validate vinext Worker output and optionally deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: build/ministaff-from-scratch

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture current dependency audit report
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-report.json" || true
          cp "$RUNNER_TEMP/npm-audit-report.json" npm-audit-report.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          let report = {};
          try { report = JSON.parse(readFileSync("npm-audit-report.json", "utf8")); } catch {}
          const v = report.metadata?.vulnerabilities ?? {};
          const summary = [
            "## Dependency audit (informational; not a deployment gate)",
            "",
            `- Critical: ${v.critical ?? "unknown"}`,
            `- High: ${v.high ?? "unknown"}`,
            `- Moderate: ${v.moderate ?? "unknown"}`,
            `- Low: ${v.low ?? "unknown"}`,
            "",
            "Full npm audit JSON is attached to this workflow's build artifact."
          ].join("\n");
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          NODE

      - name: Audit production dependencies separately
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production-report.json" || true
          cp "$RUNNER_TEMP/npm-audit-production-report.json" npm-audit-production-report.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          let report = {};
          try { report = JSON.parse(readFileSync("npm-audit-production-report.json", "utf8")); } catch {}
          const v = report.metadata?.vulnerabilities ?? {};
          const summary = [
            "## Production dependency audit (dev tools excluded)",
            "",
            `- Critical: ${v.critical ?? "unknown"}`,
            `- High: ${v.high ?? "unknown"}`,
            `- Moderate: ${v.moderate ?? "unknown"}`,
            `- Low: ${v.low ?? "unknown"}`,
            "",
            "Full npm audit JSON is attached to this workflow's build artifact."
          ].join("\\n");
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\\n");
          if ((v.critical ?? 0) > 0 || (v.high ?? 0) > 0) {
            console.error("Blocking staging deployment: production dependencies have critical or high npm audit findings.");
            process.exitCode = 1;
          }
          NODE

      - name: Detect persisted Cloudflare configuration
        id: config-state
        shell: bash
        run: |
          if [ -f cloudflare.config.ts ] && [ -f vite.config.ts ] && grep -q 'vinext/server/fetch-handler' cloudflare.config.ts; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Cloudflare/vinext configuration
        if: steps.config-state.outputs.configured != 'true'
        run: npx --yes vinext@1.2.1 init --platform=cloudflare --skip-check

      - name: Set dedicated staging Worker name
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "cloudflare.config.ts";
          const source = readFileSync(path, "utf8");
          if (!source.includes('entrypoint: "vinext/server/fetch-handler"')) {
            throw new Error("Unexpected Cloudflare config format; refusing to rewrite it.");
          }
          const updated = source.replace(/name:\s*["'][^"']+["']/, 'name: "ministaff-ai-dashboard-staging"');
          if (!updated.includes('name: "ministaff-ai-dashboard-staging"')) {
            throw new Error("Could not set the staging Worker name.");
          }
          writeFileSync(path, updated);
          NODE

      - name: Build the application for Cloudflare
        run: npm run build:vinext

      - name: Validate Cloudflare deployment output without publishing
        run: npm run deploy:vinext -- --skip-build --dry-run

      - name: Upload generated build output for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ministaff-cloudflare-build-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            .cloudflare/output/**
            cloudflare.config.ts
            vite.config.ts
            wrangler.jsonc
            package.json
            package-lock.json
            npm-audit-report.json
            npm-audit-production-report.json

      - name: Deploy dedicated staging Worker
        if: success() && steps.config-state.outputs.configured == 'true' && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1dc3a9e8f35be58924fb55dc5f7d0298"
        run: npm run deploy:vinext -- --skip-build

      - name: Verify staging health endpoint
        if: success() && steps.config-state.outputs.configured == 'true' && env.HAS_CF_TOKEN == 'true'
        shell: bash
        run: |
          url="https://ministaff-ai-dashboard-staging.itsmeadityabro.workers.dev/api/health"
          response=""
          for attempt in 1 2 3 4 5 6 7 8; do
            response="$(curl --fail --silent --show-error "$url" 2>/dev/null || true)"
            if [ -n "$response" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$response" ]; then
            echo "Staging health endpoint did not return a successful response: $url"
            exit 1
          fi
          printf '%s' "$response" | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const payload = JSON.parse(input);
            if (payload.ok !== true || payload.service !== "ministaff-ai") {
              console.error("Unexpected health response:", payload);
              process.exit(1);
            }
            console.log("Staging health verified:", JSON.stringify(payload));
          '
          echo "## Staging deployed and health-checked" >> "$GITHUB_STEP_SUMMARY"
          echo "Health endpoint: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped staging deployment
        if: success() && steps.config-state.outputs.configured == 'true' && env.HAS_CF_TOKEN != 'true'
        run: |
          echo "## Staging deployment skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Build and dry-run passed, but the repository secret CLOUDFLARE_API_TOKEN is not configured. No Worker was published." >> "$GITHUB_STEP_SUMMARY"

      - name: Persist validated Cloudflare config and lockfile
        if: success() && steps.config-state.outputs.configured != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts cloudflare.config.ts
          if git diff --cached --quiet; then
            echo "No generated configuration changes to commit."
          else
            git commit -m "build: add validated Cloudflare Worker configuration"
            git push origin HEAD:build/ministaff-from-scratch
          fi

      - name: Persist tested dependency lockfile fixes
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The committed lockfile already matches the tested dependency graph."
          else
            git commit -m "security: refresh patched dependency lockfile"
            git push origin HEAD:build/ministaff-from-scratch
          fi
